spring:
  application:
    name: storage-service

  datasource:
    url: jdbc:postgresql://localhost:5434/storage_service
    username: storage
    password: storage
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dealership
          jwk-set-uri: http://localhost:8180/realms/dealership/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: storage-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

jwt:
  auth:
    converter:
      resource-id: dealership-app
      principal-attribute: preferred_username

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
grpc:
  server:
    address: 127.0.0.1
    port: 9090

reservation:
  hold-ttl: PT15M
  recovery:
    interval: PT10S
    batch-size: 100

outbox:
  publisher:
    interval: PT1S
    batch-size: 100
    claim-duration: PT30S
    send-timeout: PT10S
