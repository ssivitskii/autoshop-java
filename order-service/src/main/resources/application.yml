spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/order_service
    username: orders
    password: orders
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dealership
          jwk-set-uri: http://localhost:8180/realms/dealership/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dealership.common.event"

jwt:
  auth:
    converter:
      resource-id: dealership-app
      principal-attribute: preferred_username

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8081

outbox:
  scheduler:
    rate: 5000
reservation:
  recovery:
    interval: PT10S
    batch-size: 100
grpc:
  client:
    storage-service:
      address: static://localhost:9090
      negotiation-type: plaintext
      deadline-after: 5000
