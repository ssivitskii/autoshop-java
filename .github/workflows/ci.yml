name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Assemble
        run: ./gradlew --no-daemon clean assemble

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Integration tests (Testcontainers)
        run: ./gradlew --no-daemon integrationTest

      - name: Two-service end-to-end tests
        run: ./gradlew --no-daemon :order-service:e2eTest

      - name: Upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: order-service/build/e2e-logs
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete stack
        run: docker compose up --build --wait --wait-timeout 300

      - name: Real JWT, gRPC and Kafka smoke test
        run: bash scripts/compose-smoke.sh

      - name: Capture Compose logs
        if: failure()
        run: |
          docker compose ps --all > compose-state.log
          docker compose logs --no-color > compose-smoke.log
          : > compose-health.log
          for container_id in $(docker compose ps --all --quiet); do
            container_name=$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##')
            printf '\n%s\n' "$container_name" >> compose-health.log
            docker inspect --format '{{json .State.Health}}' "$container_id" >> compose-health.log
          done

      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: |
            compose-smoke.log
            compose-state.log
            compose-health.log
          if-no-files-found: ignore

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
